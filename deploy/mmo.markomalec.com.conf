# Apache vhost for the game. Mirrors the working n8n/smartsite pattern on this
# host. Install with:
#   sudo cp mmo.markomalec.com.conf /etc/apache2/sites-available/
#   sudo a2ensite mmo.markomalec.com && sudo systemctl reload apache2
# Get the certificate first (see README): certbot needs :80 to answer.
<IfModule mod_ssl.c>
    <VirtualHost *:80>
        ServerName mmo.markomalec.com
        Redirect permanent / https://mmo.markomalec.com/
    </VirtualHost>

    <VirtualHost *:443>
        ServerName mmo.markomalec.com

        SSLEngine on
        SSLCertificateFile /etc/letsencrypt/live/mmo.markomalec.com/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/mmo.markomalec.com/privkey.pem
        Include /etc/letsencrypt/options-ssl-apache.conf

        ProxyPreserveHost On
        ProxyRequests Off
        ProxyTimeout 600

        # /ws is the realtime daemon on 3001. Long-lived upgrades go through
        # mod_proxy_wstunnel; anything else on that path is a plain proxy.
        RewriteEngine On
        RewriteCond %{HTTP:Upgrade} =websocket [NC]
        RewriteRule ^/ws/?(.*) ws://127.0.0.1:3001/$1 [P,L]
        RewriteCond %{HTTP:Upgrade} !=websocket [NC]
        RewriteRule ^/ws/?(.*) http://127.0.0.1:3001/$1 [P,L]

        # Everything else is the Next server on 3000.
        ProxyPass /ws !
        ProxyPass / http://127.0.0.1:3000/
        ProxyPassReverse / http://127.0.0.1:3000/

        ErrorLog ${APACHE_LOG_DIR}/aergyle-error.log
        CustomLog ${APACHE_LOG_DIR}/aergyle-access.log combined
    </VirtualHost>
</IfModule>
