# Builds the deploy image and publishes it to GitHub Container Registry.
#
# Both architectures are built on native runners (free for public repos), so
# the same tag runs on the Pi today and on an x86 VPS later without a rebuild.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ws_url:
        description: "Public websocket URL baked into the client bundle"
        required: false
        default: "wss://mmo.markomalec.com/ws"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Advisory only. next.config.js sets ignoreBuildErrors, so a broken type
  # would otherwise ship silently. This surfaces it without blocking a deploy.
  typecheck:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: "mysql://build:build@127.0.0.1:3306/build"
      - run: npx tsc --noEmit

  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Resolve names
        id: names
        run: |
          echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            NEXT_PUBLIC_REALTIME_WS_URL=${{ github.event.inputs.ws_url || 'wss://mmo.markomalec.com/ws' }}
          outputs: type=image,name=${{ steps.names.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.names.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.names.outputs.slug }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.names.outputs.slug }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # Stitches the per-arch images into one multi-arch tag.
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve image name
        id: names
        run: echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          IMAGE='${{ steps.names.outputs.image }}'
          SHA='${{ github.sha }}'
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${SHA}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Summary
        run: |
          IMAGE='${{ steps.names.outputs.image }}'
          {
            echo "### Published"
            echo
            echo '```'
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${{ github.sha }}"
            echo '```'
            echo
            echo "Deploy on the host:"
            echo '```'
            echo "cd ~/aergyle-deploy && ./deploy.sh ${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
